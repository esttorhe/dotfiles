# ABOUTME: Validate the local Python tools (multica-reaper, rex-resurrect) before commits.
# ABOUTME: Use pinned lint and formatting checks without changing unrelated dotfiles.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--isolated]
        files: ^dot_local/share/(multica-reaper|rex-resurrect)/.*\.py$
      - id: ruff-format
        args: [--isolated]
        files: ^dot_local/share/(multica-reaper|rex-resurrect)/.*\.py$
